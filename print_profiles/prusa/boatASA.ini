# PrusaSlicer filament preset - ASA, boosted for this job
# Same two changes as the Bambu preset: hotter for interlayer strength, and a
# raised volumetric cap. NEITHER IS PRINT-TESTED. Run the max volumetric speed
# calibration at this temperature before committing to 400-odd hours.
# Verified against PrusaSlicer 2.9.6 on 2026-08-31: Prusa ship NO 'Generic ASA'
# profile at all, only Prusament ASA variants, so the old inherits could never
# resolve. NOTE the stock cap on this profile is 26 mm3/s -- Prusa's own figure
# for Prusament ASA on a Core One HF0.4. The 16 below is the conservative
# carry-over from the Bambu profile and is still the untested one. Measured on
# chunk #043: raising 16 -> 26 saved 22 min on a 5 h 56 print (6%). These chunks
# are move-limited, not flow-limited; the cap is not the lever it looks like.
inherits = Prusament ASA @COREONE HF0.4
filament_max_volumetric_speed = 16
temperature = 275
first_layer_temperature = 275
