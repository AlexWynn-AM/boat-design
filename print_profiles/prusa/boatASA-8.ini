# PrusaSlicer print preset - boat chunks, 8% core
# The preset name is the FILE NAME, so keep it. Copy into the PrusaSlicer
# user print/ directory (see README.md in this folder) and restart.
inherits = 0.25mm DRAFT @COREONE
perimeters = 1
perimeter_extrusion_width = 0.5
external_perimeter_extrusion_width = 0.5
fill_pattern = gyroid
fill_density = 8%
infill_overlap = 25%
top_solid_layers = 3
top_solid_min_thickness = 0
bottom_solid_layers = 3
bottom_solid_min_thickness = 0
brim_type = outer_only
brim_width = 8
brim_separation = 0
