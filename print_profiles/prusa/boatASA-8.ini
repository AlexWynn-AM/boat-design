# PrusaSlicer print preset - boat chunks, 8% core
# The preset name is the FILE NAME, so keep it. Copy into the PrusaSlicer
# user print/ directory (see README.md in this folder) and restart.
# Verified against PrusaSlicer 2.9.6's bundled PrusaResearch.ini on 2026-08-31.
# There is no '0.25mm DRAFT @COREONE': Prusa ship DRAFT only at 0.28 mm, and only
# for the HF0.4 nozzle. SPEED is the closest profile at the 0.25 mm layer this
# job is specified in. For 0.28 mm and ~10%% less time, inherit 0.28mm DRAFT
# @COREONE HF0.4 instead; with a 0.6 HF fitted, 0.32mm SPEED @COREONE HF0.6.
inherits = 0.25mm SPEED @COREONE HF0.4
perimeters = 1
perimeter_extrusion_width = 0.5
external_perimeter_extrusion_width = 0.5
fill_pattern = gyroid
fill_density = 8%
infill_overlap = 25%
top_solid_layers = 3
top_solid_min_thickness = 0
bottom_solid_layers = 3
bottom_solid_min_thickness = 0
brim_type = outer_only
brim_width = 8
brim_separation = 0
